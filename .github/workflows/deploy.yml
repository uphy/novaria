name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定では読むだけにする。書き込みが要るジョブだけ、ジョブの permissions で足す
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # e2e は PR の CI で回している。ここは本番に出す直前の保険として速いものだけ
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          BUILD_COMMIT: ${{ github.sha }}
      # ランキングの置き場（D1）を用意し、本物の id を入れた設定でデプロイする。
      # commit には本物の id を残さないので、ここで作り直す
      - run: |
          node tools/prepare-score-database.mjs wrangler.jsonc .wrangler-deploy.json
          pnpm exec wrangler deploy -c .wrangler-deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
